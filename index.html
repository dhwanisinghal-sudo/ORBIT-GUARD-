<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>OrbitGuard — Live Orbital Tracking</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060b16;
    --panel: #0c1526;
    --panel-border: #1c2b45;
    --text: #dce6f5;
    --text-dim: #7c8aa3;
    --accent: #4fd1c5;
    --risk-low: #34d399;
    --risk-medium: #fbbf24;
    --risk-high: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  h1, h2, .mono-label { font-family: 'Space Grotesk', sans-serif; }

  #app { display: flex; height: 100vh; width: 100vw; }

  #globe-wrap { flex: 1; position: relative; }
  #globe-canvas { position: absolute; inset: 0; }

  #header {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 28px 32px 0 32px;
    pointer-events: none;
    z-index: 5;
  }
  #header h1 {
    font-size: 22px; font-weight: 700; margin: 0;
    letter-spacing: 0.2px;
  }
  #header p {
    margin: 6px 0 0 0; color: var(--text-dim); font-size: 13px;
  }
  #status-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    margin-right: 7px; vertical-align: middle;
  }
  #status-dot.ok { background: var(--risk-low); box-shadow: 0 0 8px var(--risk-low); }
  #status-dot.err { background: var(--risk-high); box-shadow: 0 0 8px var(--risk-high); }
  #status-dot.loading { background: var(--text-dim); }

  #sidebar {
    width: 360px;
    background: var(--panel);
    border-left: 1px solid var(--panel-border);
    padding: 28px 22px;
    overflow-y: auto;
  }
  #sidebar h2 {
    font-size: 13px; text-transform: none; letter-spacing: 0.3px;
    color: var(--text-dim); font-weight: 500; margin: 0 0 14px 0;
  }
  .section { margin-bottom: 30px; }

  .stat-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 10px 0; border-bottom: 1px solid var(--panel-border);
  }
  .stat-row .label { color: var(--text-dim); font-size: 13px; }
  .stat-row .value { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; }

  .sat-item {
    padding: 10px 0; border-bottom: 1px solid var(--panel-border);
    cursor: pointer; transition: opacity 0.15s;
  }
  .sat-item:hover { opacity: 0.7; }
  .sat-item .name { font-size: 14px; font-weight: 500; }
  .sat-item .meta { font-size: 12px; color: var(--text-dim); margin-top: 2px; }

  .conj-item {
    padding: 12px; margin-bottom: 8px; border-radius: 6px;
    background: #0f1c30; border-left: 3px solid var(--risk-medium);
  }
  .conj-item.HIGH { border-left-color: var(--risk-high); }
  .conj-item.MEDIUM { border-left-color: var(--risk-medium); }
  .conj-item.LOW { border-left-color: var(--risk-low); }
  .conj-item .pair { font-size: 13px; font-weight: 500; }
  .conj-item .dist { font-size: 12px; color: var(--text-dim); margin-top: 3px; }
  .conj-item .risk-badge {
    display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    margin-left: 6px; font-family: 'Space Grotesk', sans-serif;
  }
  .conj-item.HIGH .risk-badge { background: rgba(251,113,133,0.15); color: var(--risk-high); }
  .conj-item.MEDIUM .risk-badge { background: rgba(251,191,36,0.15); color: var(--risk-medium); }
  .conj-item.LOW .risk-badge { background: rgba(52,211,153,0.15); color: var(--risk-low); }

  .empty-state { color: var(--text-dim); font-size: 13px; padding: 14px 0; }

  #config-note {
    font-size: 11px; color: var(--text-dim); line-height: 1.5;
    background: #0f1c30; padding: 10px 12px; border-radius: 6px; margin-top: 20px;
  }
  #config-note code { color: var(--accent); }
</style>
</head>
<body>

<div id="app">
  <div id="globe-wrap">
    <div id="header">
      <h1>OrbitGuard</h1>
      <p><span id="status-dot" class="loading"></span><span id="status-text">Connecting to backend…</span></p>
    </div>
    <canvas id="globe-canvas"></canvas>
  </div>

  <div id="sidebar">
    <div class="section">
      <h2>Overview</h2>
      <div class="stat-row"><span class="label">Objects tracked</span><span class="value" id="stat-objects">–</span></div>
      <div class="stat-row"><span class="label">Conjunctions found</span><span class="value" id="stat-conjunctions">–</span></div>
    </div>

    <div class="section">
      <h2>Conjunction alerts</h2>
      <div id="conjunctions-list"><div class="empty-state">Waiting for data…</div></div>
    </div>

    <div class="section">
      <h2>Tracked objects</h2>
      <div id="objects-list"><div class="empty-state">Waiting for data…</div></div>
    </div>

    <div id="config-note">
      Reading live data from your local OrbitGuard API at <code id="api-url-display">–</code>.
      Make sure <code>uvicorn main:app --reload</code> is running.
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const API_BASE = "http://127.0.0.1:8000";
document.getElementById("api-url-display").textContent = API_BASE;

// ---------- Three.js scene setup ----------
const canvas = document.getElementById("globe-canvas");
const wrap = document.getElementById("globe-wrap");
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, wrap.clientWidth / wrap.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 16);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(wrap.clientWidth, wrap.clientHeight);

// starfield
function makeStars(count) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 80 + Math.random() * 60;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = r * Math.cos(phi);
  }
  geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({ color: 0x5a6a8a, size: 0.35, sizeAttenuation: true });
  return new THREE.Points(geo, mat);
}
scene.add(makeStars(1200));

// Earth (procedural stripes, no texture file needed)
const EARTH_RADIUS = 6.371; // scene units == 1000 km, matches API's km values / 1000
const earthGeo = new THREE.SphereGeometry(EARTH_RADIUS, 64, 64);
const earthMat = new THREE.MeshPhongMaterial({
  color: 0x1b3a5c,
  emissive: 0x08111f,
  shininess: 12,
});
const earth = new THREE.Mesh(earthGeo, earthMat);
scene.add(earth);

// simple lat/long wireframe overlay for a "tracked" look
const wireGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.002, 24, 16);
const wireMat = new THREE.MeshBasicMaterial({ color: 0x2c5c8a, wireframe: true, transparent: true, opacity: 0.35 });
scene.add(new THREE.Mesh(wireGeo, wireMat));

// atmosphere glow
const glowGeo = new THREE.SphereGeometry(EARTH_RADIUS * 1.04, 48, 48);
const glowMat = new THREE.MeshBasicMaterial({ color: 0x4fd1c5, transparent: true, opacity: 0.06 });
scene.add(new THREE.Mesh(glowGeo, glowMat));

scene.add(new THREE.AmbientLight(0x445577, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.0);
sun.position.set(20, 10, 10);
scene.add(sun);

// mouse-drag orbit controls (no extra dependency needed)
let isDragging = false, prevX = 0, prevY = 0;
let rotX = 0.2, rotY = 0.4;
canvas.addEventListener("mousedown", (e) => { isDragging = true; prevX = e.clientX; prevY = e.clientY; });
window.addEventListener("mouseup", () => isDragging = false);
window.addEventListener("mousemove", (e) => {
  if (!isDragging) return;
  rotY += (e.clientX - prevX) * 0.005;
  rotX += (e.clientY - prevY) * 0.005;
  rotX = Math.max(-1.3, Math.min(1.3, rotX));
  prevX = e.clientX; prevY = e.clientY;
});
canvas.addEventListener("wheel", (e) => {
  camera.position.z = Math.max(9, Math.min(30, camera.position.z + e.deltaY * 0.01));
});

const satelliteGroup = new THREE.Group();
scene.add(satelliteGroup);

function clearSatellites() {
  while (satelliteGroup.children.length) satelliteGroup.remove(satelliteGroup.children[0]);
}

function addSatelliteDot(obj, colorHex) {
  const geo = new THREE.SphereGeometry(0.09, 8, 8);
  const mat = new THREE.MeshBasicMaterial({ color: colorHex });
  const mesh = new THREE.Mesh(geo, mat);
  // API gives km; scale to scene units (Earth radius 6371 km -> EARTH_RADIUS units)
  const scale = EARTH_RADIUS / 6371;
  mesh.position.set(obj.position_km.x * scale, obj.position_km.z * scale, obj.position_km.y * scale);
  mesh.userData = obj;
  satelliteGroup.add(mesh);
}

function animate() {
  requestAnimationFrame(animate);
  earth.rotation.y += 0.0009;
  camera.position.x = Math.sin(rotY) * Math.cos(rotX) * camera.position.z;
  camera.position.y = Math.sin(rotX) * camera.position.z;
  camera.position.z = camera.position.z; // radius controlled by wheel
  const r = camera.position.length();
  camera.position.set(
    r * Math.sin(rotY) * Math.cos(rotX),
    r * Math.sin(rotX),
    r * Math.cos(rotY) * Math.cos(rotX)
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = wrap.clientWidth / wrap.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(wrap.clientWidth, wrap.clientHeight);
});

// ---------- API calls + UI wiring ----------
function setStatus(state, text) {
  const dot = document.getElementById("status-dot");
  dot.className = state;
  document.getElementById("status-text").textContent = text;
}

function riskColor(level) {
  if (level === "HIGH") return 0xfb7185;
  if (level === "MEDIUM") return 0xfbbf24;
  return 0x34d399;
}

async function refreshData() {
  try {
    setStatus("loading", "Fetching latest positions…");
    const objRes = await fetch(`${API_BASE}/objects?group=stations`);
    if (!objRes.ok) throw new Error(`objects: HTTP ${objRes.status}`);
    const objData = await objRes.json();

    const conjRes = await fetch(`${API_BASE}/conjunctions?group=stations`);
    const conjData = conjRes.ok ? await conjRes.json() : { count: 0, conjunctions: [] };

    renderObjects(objData.objects || []);
    renderConjunctions(conjData.conjunctions || []);

    document.getElementById("stat-objects").textContent = objData.count ?? objData.objects.length;
    document.getElementById("stat-conjunctions").textContent = conjData.count ?? 0;

    setStatus("ok", `Live — updated ${new Date().toLocaleTimeString()}`);
  } catch (err) {
    setStatus("err", "Can't reach backend — is uvicorn running?");
    console.error(err);
  }
}

function renderObjects(objects) {
  clearSatellites();
  const list = document.getElementById("objects-list");
  if (!objects.length) {
    list.innerHTML = `<div class="empty-state">No objects returned.</div>`;
    return;
  }
  list.innerHTML = "";
  objects.forEach(obj => {
    addSatelliteDot(obj, 0x4fd1c5);
    const div = document.createElement("div");
    div.className = "sat-item";
    div.innerHTML = `
      <div class="name">${obj.name}</div>
      <div class="meta">NORAD ${obj.norad_id} · ${obj.altitude_km.toFixed(0)} km altitude</div>
    `;
    list.appendChild(div);
  });
}

function renderConjunctions(conjunctions) {
  const list = document.getElementById("conjunctions-list");
  if (!conjunctions.length) {
    list.innerHTML = `<div class="empty-state">No close approaches detected right now.</div>`;
    return;
  }
  list.innerHTML = "";
  conjunctions.forEach(c => {
    const div = document.createElement("div");
    div.className = `conj-item ${c.risk_level}`;
    div.innerHTML = `
      <div class="pair">${c.object_1.name} ↔ ${c.object_2.name}
        <span class="risk-badge">${c.risk_level}</span>
      </div>
      <div class="dist">${c.distance_km.toFixed(2)} km apart · rel. velocity ${c.relative_velocity_km_s.toFixed(2)} km/s</div>
    `;
    list.appendChild(div);
  });
}

refreshData();
setInterval(refreshData, 15000); // refresh every 15s
</script>
</body>
</html>
